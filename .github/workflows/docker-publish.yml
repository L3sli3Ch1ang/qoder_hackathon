# add these permissions at workflow root
name: Publish Docker Image

on:
  push:
    branches:
      - main          # change if your default branch is different
  workflow_dispatch:   # lets you run it manually from the Actions UI

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # If using a PAT instead, use:
        # username: your-github-username
        # password: ${{ secrets.MY_GHCR_PAT }}

      - name: Show image tag
              run: echo "IMAGE TAG=ghcr.io/${{ toLower(github.repository_owner) }}/qoder_hackathon:latest"      

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ghcr.io/${{ toLower(github.repository_owner) }}/qoder_hackathon:latest
